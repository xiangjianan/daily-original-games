<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>星图回航</title><style>*{box-sizing:border-box}body{margin:0;background:#111d32;color:#e7eff4;font:17px/1.65 system-ui}main{max-width:640px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;font-size:12px;color:#8eafc4;align-items:center}h1{font-size:clamp(40px,8vw,62px);margin:24px 0 8px}p{color:#aabecb}button{font:inherit;cursor:pointer;background:#254863;color:white;border:1px solid #5d91a7;border-radius:14px;padding:12px 16px}button:focus-visible{outline:4px solid #eab65f;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.stats{display:flex;justify-content:space-between;margin:23px 0}.stats b{display:block;font-size:25px}#route{background:#23344a;border:1px solid #455d75;border-radius:18px;padding:18px;min-height:106px;text-align:center;font-size:24px;letter-spacing:3px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.star{aspect-ratio:1;background:#1d3047;font-size:25px;padding:5px}.star small{display:block;font-size:11px;color:#91b7c6}.seen{background:#415b70;border-color:#e8c677}.done{background:#26766b}#msg{min-height:58px}#result{padding:18px;border:2px solid #6b9aaa;border-radius:18px;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}textarea{width:100%;min-height:100px;margin-top:12px}footer{font-size:12px;margin-top:24px}a{color:#9bcfdf}</style><main><header><span>RETURN CONSTELLATION / 027</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>星图回航</h1><p>记住出发路线，倒着点回来。</p><div class="stats"><div>航段<b id="round">1 / 6</b></div><div>信号<b id="hp">♥♥♥</b></div><div>得分<b id="score">0</b></div><div>最高<b id="best">0</b></div></div><div id="route">A1 → B2 → C3<br><small>回航时：C3 → B2 → A1</small></div><div class="board" id="board"></div><p id="msg" role="status">共 6 段，路线从 3 个星点增加到 8 个。观察不限时，准备好再回航。</p><section id="result" hidden></section><div class="actions"><button id="start">开始航行</button><button id="ready" hidden>记好了，回航</button><button id="next" hidden>下一航段</button><button id="share">分享航迹</button></div><textarea id="copy" aria-label="分享文字" hidden readonly></textarea><p>回航时路线隐藏。点错损失一格信号，同一位置可继续尝试。三格耗尽结束；每段无失误奖励更多。无倒计时，约 1–3 分钟。支持 Tab/空格操作。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-27">源码、调研与设计</a> · 无广告 · 无外部素材</footer></main><script>
const $=s=>document.querySelector(s),label=i=>'ABCD'[Math.floor(i/4)]+(i%4+1);let round=0,score=0,hp=3,path=[],pos=0,phase='idle',perfect=true,muted=false,ac,best=0;try{best=+localStorage.getItem('constellation-return')||0}catch{}
function tone(ok){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(ok?440+pos*60:130,ac.currentTime);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.start();o.stop(ac.currentTime+.23)}catch{}}
function draw(){$('#round').textContent=`${round+1} / 6`;$('#hp').textContent='♥'.repeat(hp)||'—';$('#score').textContent=score;$('#best').textContent=best;$('#board').innerHTML=Array.from({length:16},(_,i)=>`<button class="star ${phase==='look'&&path.includes(i)?'seen':''} ${phase==='play'&&path.slice(path.length-pos).includes(i)?'done':''}" data-i="${i}" ${phase==='play'?'':'disabled'} aria-label="星点 ${label(i)}">✦<small>${label(i)}</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i));if(phase==='look')$('#route').textContent=path.map(label).join(' → ');else if(phase==='play')$('#route').textContent=`回航 ${pos} / ${path.length} · 从最后一个开始`;$('#ready').hidden=phase!=='look';$('#next').hidden=phase!=='between'}
function level(){let ids=Array.from({length:16},(_,i)=>i);for(let i=15;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}path=ids.slice(0,round+3);pos=0;perfect=true;phase='look';$('#msg').textContent='记住顺序，然后按“记好了，回航”。';draw()}
function start(){round=score=0;hp=3;$('#start').textContent='重新航行';$('#result').hidden=true;$('#copy').hidden=true;level();tone(true)}
function end(reason){phase='end';best=Math.max(best,score);try{localStorage.setItem('constellation-return',best)}catch{}$('#result').hidden=false;$('#result').textContent=`${reason} · ${score} 分。再来一份新星图，挑战完整返航。`;$('#route').textContent='航行结算';draw()}
function pick(i){if(phase!=='play')return;if(i===path[path.length-1-pos]){pos++;tone(true);$('#msg').textContent=`找到 ${label(i)}，继续往回走。`;if(pos===path.length){let gain=path.length*30+(perfect?100:0);score+=gain;$('#msg').textContent=`本段归航！+${gain} 分${perfect?'，无失误奖励 +100 已计入':''}`;if(round===5){end('六段全部归航');return}phase='between';$('#route').textContent='本段完成'}}else{hp--;perfect=false;tone(false);$('#msg').textContent='信号偏离，损失一格。仍从刚才的位置继续。';if(!hp){end('信号耗尽');return}}draw()}
$('#start').onclick=start;$('#ready').onclick=()=>{phase='play';$('#msg').textContent='从路线的最后一站开始，倒序点回起点。';draw()};$('#next').onclick=()=>{round++;level()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)tone(true)};$('#share').onclick=async()=>{let t=`我在《星图回航》得了 ${score} 分！你能倒序记住8个星点吗？ https://xiangjianan.github.io/daily-original-games/2026-09-27/`;$('#copy').hidden=false;$('#copy').value=t;try{await navigator.clipboard.writeText(t);$('#msg').textContent='航迹已复制。'}catch{$('#msg').textContent='请复制下方航迹。'}};draw();
</script></main></html>
