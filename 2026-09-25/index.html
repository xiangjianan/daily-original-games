<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>邻数点心铺</title><style>*{box-sizing:border-box}body{margin:0;background:#fcf2df;color:#49342b;font:17px/1.65 system-ui}main{max-width:620px;margin:auto;padding:24px 20px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#8a654a}h1{font-size:clamp(36px,8vw,58px);margin:24px 0 8px}p{color:#816a57}button{font:inherit;cursor:pointer;border:1px solid #bc9778;border-radius:14px;padding:12px 16px;background:#7d4838;color:white}button:focus-visible{outline:4px solid #246e77;outline-offset:3px}button:disabled{opacity:.6;cursor:default}.stats{display:flex;justify-content:space-between;margin:24px 0}.stats b{display:block;font-size:26px}.order{padding:20px;border-radius:22px;background:#e8dbbc;text-align:center}.order strong{font-size:42px;color:#824a33}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.tile{aspect-ratio:1;background:#e7b77f;color:#4a2c21;font-size:30px;box-shadow:0 4px 0 #b88a5f;border:2px solid transparent;padding:4px}.selected{border:4px solid #277886;background:#ffe0aa}.tile small{display:block;font-size:10px}#msg{min-height:58px}#result{border:2px solid #9f7750;border-radius:16px;padding:20px;margin:16px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}textarea{width:100%;min-height:100px;margin:15px 0}footer{font-size:12px;margin-top:24px}a{color:#78503d}</style><main><header><span>NEIGHBOR BAKERY / 2026.09.25</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>邻数点心铺</h1><p>挑两块相邻点心，凑出这一单的数字。</p><div class="stats"><div>完成订单<b id="round">0 / 12</b></div><div>得分<b id="score">0</b></div><div>耐心<b id="hp">♥♥♥</b></div><div>最高<b id="best">0</b></div></div><section class="order">本单需要 <strong id="target">?</strong><div>上下左右相邻 · 两数相加</div></section><div id="board"></div><p id="msg" role="status">12 单一局。出炉后，两块点心补新，周围邻格 +1（超过 9 回到 1）。</p><section id="result" hidden></section><div class="actions"><button id="start">开门营业</button><button id="share">分享成绩</button></div><textarea id="copy" aria-label="分享文字" hidden readonly></textarea><p>再次点选中点心可取消。选不相邻的点心会改选，不扣耐心；相邻但加错扣一颗心。连对加分，数字逐段变大。无倒计时，约 1–3 分钟。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-25">调研、规则与源码</a> · 无广告 · 本机最高分</footer></main><script>
const $=s=>document.querySelector(s);let cells=Array(16).fill(1),round=0,score=0,hp=3,target=2,selected=-1,combo=0,active=false,muted=false,ac,best=0;try{best=+localStorage.getItem('neighbor-bakery')||0}catch{}
function neighbors(i){return [i%4>0?i-1:-1,i%4<3?i+1:-1,i>=4?i-4:-1,i<12?i+4:-1].filter(v=>v>=0)}function rand(){return 1+Math.floor(Math.random()*(round<4?4:round<8?6:9))}function order(){let i=Math.floor(Math.random()*16),ns=neighbors(i);target=cells[i]+cells[ns[Math.floor(Math.random()*ns.length)]]}function tone(ok){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(ok?480:130,ac.currentTime);o.frequency.exponentialRampToValueAtTime(ok?850:80,ac.currentTime+.2);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.start();o.stop(ac.currentTime+.23)}catch{}}
function draw(){$('#round').textContent=`${round} / 12`;$('#score').textContent=score;$('#hp').textContent='♥'.repeat(hp)||'—';$('#target').textContent=active?target:'—';$('#best').textContent=best;$('#board').innerHTML=cells.map((v,i)=>`<button class="tile ${i===selected?'selected':''}" data-i="${i}" aria-label="第${Math.floor(i/4)+1}行第${i%4+1}列，${v}" aria-pressed="${i===selected}" ${active?'':'disabled'}>${v}<small>${Math.floor(i/4)+1} · ${i%4+1}</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(+b.dataset.i))}
function start(){round=score=combo=0;hp=3;selected=-1;active=true;cells=Array.from({length:16},rand);order();$('#result').hidden=true;$('#copy').hidden=true;$('#start').textContent='重新营业';$('#msg').textContent='先选一块，再选它的上下左右邻居。';tone(true);draw()}
function pick(i){if(!active)return;if(selected===i){selected=-1;draw();return}if(selected<0||!neighbors(selected).includes(i)){selected=i;$('#msg').textContent=`已选 ${cells[i]}，寻找相邻的 ${target-cells[i]}。`;draw();document.querySelector(`[data-i="${i}"]`).focus();return}let j=selected;selected=-1;if(cells[i]+cells[j]===target){round++;combo++;let gain=100+Math.min(combo-1,5)*20;score+=gain;let affected=new Set([...neighbors(i),...neighbors(j)]);affected.delete(i);affected.delete(j);affected.forEach(k=>cells[k]=cells[k]%9+1);cells[i]=rand();cells[j]=rand();$('#msg').textContent=`出炉！+${gain} 分 · 连对 ${combo} 单 · 周围数字 +1`;tone(true);if(round<12)order()}else{hp--;combo=0;$('#msg').textContent='加起来不等于订单，耐心 -1。再看一眼。';tone(false)}if(round===12||hp===0){active=false;best=Math.max(best,score);try{localStorage.setItem('neighbor-bakery',best)}catch{}$('#result').hidden=false;$('#result').textContent=`${round===12?'12 单全部完成':'本次营业结束'} · ${score} 分！完成 ${round} 单。再来一盘，挑战连续出炉。`}draw()}
$('#start').onclick=start;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)tone(true)};$('#share').onclick=async()=>{let t=`我在《邻数点心铺》完成 ${round} 单，得 ${score} 分！ https://xiangjianan.github.io/daily-original-games/2026-09-25/`;$('#copy').hidden=false;$('#copy').value=t;try{await navigator.clipboard.writeText(t);$('#msg').textContent='成绩已复制，发给朋友一起试试。'}catch{$('#msg').textContent='请复制下方成绩文字。'}};draw();
</script></main></html>
