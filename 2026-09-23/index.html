<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>借风送星</title><style>*{box-sizing:border-box}body{margin:0;background:#101f35;color:#f3e8c7;font:17px/1.6 system-ui}main{max-width:760px;margin:auto;padding:26px 18px}header{display:flex;justify-content:space-between;align-items:center;color:#8abdbb;font-size:13px}h1{font-size:clamp(38px,8vw,66px);margin:25px 0 0}p{color:#b3c7cc}button{font:inherit;cursor:pointer;border:1px solid #80bdb0;background:#173b48;color:#fff2c5;padding:13px 18px;border-radius:14px}button:disabled{opacity:.45;cursor:default}button:focus-visible{outline:3px solid #ffcc72;outline-offset:3px}.stats{display:flex;justify-content:space-between;padding:20px 0}.stats b{display:block;font-size:26px}.sea{background:#193a50;padding:24px;border-radius:24px;border:1px solid #3e6372}.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.route{background:#224b5c;padding:20px 4px;text-align:center;border-radius:16px}.icon{font-size:36px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}#wind{text-align:center;font-size:22px;color:#ffe0a0}#msg{min-height:60px}#result{padding:20px;background:#294952;border-radius:18px;margin:15px 0}textarea{width:100%;height:90px;background:#edf4ee;color:#173b48}footer{font-size:12px;margin-top:24px}a{color:#95d9d0}</style><main><header><span>STAR MAIL / 2026.09.23</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>借风送星</h1><p>选航道，借风走。把星星平安送进港口。</p><section class="stats"><div>已送达<b id="score">0</b></div><div>船上星星<b id="cargo">0</b></div><div>船体<b id="hp">♥♥♥</b></div><div>航程<b id="step">0 / 18</b></div></section><section class="sea"><div id="wind">风会把你的选择推向相邻航道</div><div class="routes" id="routes"></div><div class="controls"><button data-lane="0" disabled>左舷 · 1</button><button data-lane="1" disabled>中线 · 2</button><button data-lane="2" disabled>右舷 · 3</button></div></section><p id="msg" role="status">每 6 步自动到港存分。撞礁会损失船上一半星星和 1 点船体。</p><section id="result" hidden></section><button id="start">启航</button> <button id="share">分享航迹</button><textarea id="copy" aria-label="分享内容" hidden readonly></textarea><p>看箭头再选路线；风吹越边界会绕到另一侧。每步可慢慢想，18 步约 1–2 分钟。★ +1 星，✦ +3 星，▲ 礁石，～ 安全水面。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-23">源码与原创设计</a> · 无广告 · 本机保存最高分</footer></main><script>
const $=s=>document.querySelector(s),icons=['～','★','✦','▲'];let step=0,score=0,cargo=0,hp=3,wind=0,row=[1,2,0],active=false,muted=false,ac;let best=0;try{best=+localStorage.getItem('star-mail-best')||0}catch{}
function sound(good){if(muted)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(good?520:150,ac.currentTime);o.frequency.exponentialRampToValueAtTime(good?850:80,ac.currentTime+.15);g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.start();o.stop(ac.currentTime+.23)}catch{}}
function next(){wind=step<3?0:Math.floor(Math.random()*3)-1;row=Array.from({length:3},()=>Math.floor(Math.random()*3));if(step>=6)row[Math.floor(Math.random()*3)]=3;if(step>=12&&Math.random()<.35)row[(row.indexOf(3)+1)%3]=3;}
function draw(){ $('#score').textContent=score;$('#cargo').textContent=cargo;$('#hp').textContent='♥'.repeat(hp)||'—';$('#step').textContent=`${step} / 18`;$('#wind').textContent=active?`${wind===0?'无风 · 原航道':wind===1?'风向 → · 右移一格':'风向 ← · 左移一格'} ｜ ${6-step%6} 步后到港`:'准备好了吗？';$('#routes').innerHTML=row.map((v,i)=>`<div class="route"><div>${['左','中','右'][i]}航道</div><div class="icon">${icons[v]}</div></div>`).join('');document.querySelectorAll('[data-lane]').forEach((b,i)=>{b.disabled=!active;let dest=(i+wind+3)%3;b.textContent=`${['左舷','中线','右舷'][i]} · ${i+1}`;b.setAttribute('aria-label',`${i+1}号出发，落点${['左','中','右'][dest]}航道 ${icons[row[dest]]}`)})}
function start(){step=score=cargo=0;hp=3;active=true;next();$('#result').hidden=true;$('#copy').hidden=true;$('#start').textContent='重新启航';$('#msg').textContent='前 3 步无风，试着收集亮星。';sound(true);draw()}
function move(i){if(!active)return;let dest=(i+wind+3)%3,v=row[dest];if(v===3){hp--;cargo=Math.floor(cargo/2);$('#msg').textContent='撞礁！船体 -1，船上星星减半。';sound(false)}else{cargo+=v===2?3:v===1?1:0;$('#msg').textContent=v?`收下 ${v===2?3:1} 颗星，靠港后才能计分。`:'平安穿过水面。';sound(true)}step++;if(step%6===0&&hp>0){score+=cargo;$('#msg').textContent=`已靠港！送达 ${cargo} 颗星。`;cargo=0}if(hp===0||step===18){active=false;best=Math.max(best,score);try{localStorage.setItem('star-mail-best',best)}catch{}$('#result').hidden=false;$('#result').textContent=`${hp?'航行完成':'船体耗尽'} · 送达 ${score} 颗星 · 最高 ${best}。${hp?'再来一局，找到更好的航线！':'未送达的星星不计分。'}`}else next();draw()}
document.querySelectorAll('[data-lane]').forEach((b,i)=>b.onclick=()=>move(i));$('#start').onclick=start;document.addEventListener('keydown',e=>{if(e.target.tagName!=='TEXTAREA'&&['1','2','3'].includes(e.key)){e.preventDefault();move(+e.key-1)}});$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)sound(true)};$('#share').onclick=async()=>{let text=`我在《借风送星》送达 ${score} 颗星！ https://xiangjianan.github.io/daily-original-games/2026-09-23/`;$('#copy').hidden=false;$('#copy').value=text;try{await navigator.clipboard.writeText(text);$('#msg').textContent='航迹已复制。'}catch{$('#msg').textContent='请复制下方航迹文字。'}};draw();
</script></html>
