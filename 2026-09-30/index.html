<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月秤码头</title><style>*{box-sizing:border-box}body{margin:0;background:#101e30;color:#eef5fc;font:17px/1.6 system-ui}main{max-width:680px;margin:auto;padding:24px 18px}h1{font-size:40px;margin:5px 0}.eyebrow{color:#8cdacb;letter-spacing:3px;font-size:12px}.intro{color:#bacbdc}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px;background:#89e3cc;color:#102a34;font-weight:700}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #ffcb76;outline-offset:3px}.top,.stats{display:flex;justify-content:space-between;gap:10px;align-items:center}.stats{background:#1e3249;padding:14px;border-radius:14px;margin:20px 0;font-size:15px}.panel{border:1px solid #3b5268;border-radius:22px;padding:20px;background:#17283d}.cargo{font-size:44px;color:#ffd393;font-weight:800}.small{font-size:14px;color:#b5c7da}.track{position:relative;height:60px;margin:30px 5px 8px;border-bottom:2px solid #7a95b1}.mark{position:absolute;bottom:-8px;transform:translateX(-50%);font-size:25px;color:#8ce5d0}.goal{position:absolute;top:0;transform:translateX(-50%);color:#ffc573;font-weight:bold}.limits{display:flex;justify-content:space-between;color:#91a7bd;font-size:13px}.arms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 8px}.arms button{padding:16px 4px;background:#304c66;color:white}.arms b{display:block;color:#ffcf87;font-size:24px}#feedback{min-height:56px;color:#9ae6d1}#result{padding:18px;border:1px solid #ffcb76;border-radius:16px;margin:16px 0}textarea{width:100%;min-height:95px;background:#0f1c2c;color:white;border:1px solid #7392a8;padding:10px;border-radius:10px;margin-top:12px}footer{margin-top:20px}.secondary{background:#2b4057;color:white}a{color:#94e7d4}@media(max-width:420px){main{padding:16px 12px}h1{font-size:34px}.panel{padding:14px}.stats{font-size:13px}.arms{gap:5px}.arms button{font-size:14px}}</style><main><div class="top"><span class="eyebrow">MOON / BALANCE DOCK</span><button id="mute" class="secondary" aria-pressed="false">音效：开</button></div><h1>月秤码头</h1><p class="intro">点吊点放货。重量 × 距离改变刻度，<br>每四箱让月秤靠近金色目标。</p><button id="start">开始装船</button><div class="stats"><span id="progress">四航次 · 16 箱</span><span>得分 <b id="score">0</b></span><span>纪录 <b id="best">0</b></span></div><section class="panel"><div class="top"><div><div class="small">当前货箱</div><div class="cargo" id="cargo">—</div></div><div class="small" id="next">每箱都有预览<br>无需抢时间</div></div><div id="status">左右远点改变两倍刻度，近点改变一倍。</div><div class="track"><span class="goal" id="goal" style="left:50%">▼ 目标</span><span class="mark" id="mark" style="left:50%">◆</span></div><div class="limits"><span>−16</span><span>0</span><span>+16</span></div><div class="arms"><button data-arm="-2" disabled>左远<b>× −2</b><small>键 1</small></button><button data-arm="-1" disabled>左近<b>× −1</b><small>键 2</small></button><button data-arm="1" disabled>右近<b>× +1</b><small>键 3</small></button><button data-arm="2" disabled>右远<b>× +2</b><small>键 4</small></button></div><p class="small">超出安全范围会损失一格船体并归零。三格耗尽结束；每航次安全范围收紧。</p><p id="feedback" role="status" aria-live="polite">先看重量，再选距离。金色目标在每航次内保持不变。</p></section><section id="result" hidden></section><footer><button id="share" class="secondary">复制成绩与链接</button><textarea id="sharetext" aria-label="可手动复制的分享文本" hidden readonly></textarea><p class="small">每四箱自动交付：最高 200 分，偏离目标每格扣 20 分。精确命中另奖 100 分。</p><a href="https://xiangjianan.github.io/daily-original-games/">更多每日游戏 ↗</a></footer></main><script>
const $=s=>document.querySelector(s), arms=[...document.querySelectorAll('[data-arm]')];let playing=false,boxes=[],step=0,torque=0,target=0,score=0,hp=3,muted=false,ctx,best=0;try{best=+localStorage.getItem('moon-dock-best')||0}catch{}$('#best').textContent=best;
function sound(win){if(muted)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();ctx.resume();[0,1,2].forEach((n)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+n*.06;o.frequency.value=(win?440:140)*(1+n*.25);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.16)})}catch{}}
function phase(){return Math.min(3,Math.floor(step/4))}function limit(){return 12-phase()*2}function newTarget(){target=Math.floor(Math.random()*7)-3}function render(){ $('#score').textContent=score;$('#cargo').textContent=playing?boxes[step]+' 吨':'—';$('#next').textContent=playing?'接下来：'+boxes.slice(step+1,step+4).join(' · ')+' 吨':'本机纪录 · 随时重开';$('#progress').textContent=playing?`航次 ${phase()+1}/4 · 第 ${step%4+1}/4 箱 · 船体 ${hp}`:`已装 ${step}/16 箱`;$('#status').textContent=`当前刻度 ${torque} · 目标 ${target} · 安全 ±${limit()}`;$('#mark').style.left=(50+torque/32*100)+'%';$('#goal').style.left=(50+target/32*100)+'%';$('#goal').textContent='▼ '+target;arms.forEach(b=>{b.disabled=!playing;b.title=playing?'放后刻度 '+(torque+boxes[step]*Number(b.dataset.arm)):''})}
function finish(reason){playing=false;if(score>best){best=score;try{localStorage.setItem('moon-dock-best',best)}catch{}}$('#best').textContent=best;$('#result').hidden=false;$('#result').textContent=`${reason} · ${score} 分，装完 ${step}/16 箱。再试一次，争取更多精确交付！`;$('#start').textContent='再开一局';render()}
function place(a){if(!playing)return;let value=boxes[step]*a;torque+=value;let msg=`${value>=0?'+':''}${value} 刻度。`;if(Math.abs(torque)>limit()){hp--;torque=0;msg+='超载！船体 −1，月秤归零。';sound(false)}else sound(true);step++;if(hp<=0){$('#feedback').textContent=msg;finish('船体耗尽');return}if(step%4===0){let gap=Math.abs(torque-target),gain=Math.max(0,200-gap*20)+(gap===0?100:0);score+=gain;msg+=`交付偏差 ${gap}，获得 ${gain} 分！`;torque=0;if(step<16)newTarget()}$('#feedback').textContent=msg;if(step===16)finish('四航次完成');else render()}
$('#start').onclick=()=>{playing=true;boxes=Array.from({length:16},(_,i)=>1+Math.floor(Math.random()*(i<8?3:4)));step=0;torque=0;score=0;hp=3;newTarget();$('#result').hidden=true;$('#sharetext').hidden=true;$('#start').textContent='重新开始';$('#feedback').textContent='预览接下来三箱，规划四次摆放。';sound(true);render()};arms.forEach(b=>b.onclick=()=>place(+b.dataset.arm));document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA'||e.repeat)return;if('1234'.includes(e.key)){e.preventDefault();place([-2,-1,1,2][+e.key-1])}});$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent='音效：'+(muted?'关':'开');$('#mute').setAttribute('aria-pressed',muted);if(!muted)sound(true)};$('#share').onclick=async()=>{let text=`我在《月秤码头》获得 ${score} 分，装了 ${step}/16 箱！你能精确交付几次？ https://xiangjianan.github.io/daily-original-games/2026-09-30/`;$('#sharetext').hidden=false;$('#sharetext').value=text;try{await navigator.clipboard.writeText(text);$('#share').textContent='已复制，可发给朋友'}catch{$('#share').textContent='请复制下方文本'}};
</script></html>
