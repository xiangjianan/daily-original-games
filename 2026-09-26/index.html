<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>昼夜邮局</title><style>*{box-sizing:border-box}body{margin:0;background:#e9efe8;color:#243f3b;font:17px/1.6 system-ui}main{max-width:760px;margin:auto;padding:25px 18px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5c7a6e}h1{font-size:clamp(40px,8vw,64px);margin:24px 0 5px}p{color:#597067}button{font:inherit;cursor:pointer;background:#255d52;border:1px solid #649386;border-radius:14px;color:white;padding:12px 16px}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:4px solid #ce892b;outline-offset:3px}.stats{display:flex;justify-content:space-between;margin:24px 0}.stats b{display:block;font-size:27px}.incoming{background:#dae4d7;text-align:center;padding:20px;border-radius:20px}.letter{display:inline-block;padding:9px 13px;border:1px solid #ccb77d;border-radius:10px;background:#ffe1a0;color:#534322;margin:4px}.night{background:#364868;color:#f4edda;border-color:#798bad}#bags{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.bag{background:#f9faf2;color:#31554c;padding:12px 4px;min-height:208px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.stack{display:flex;flex-direction:column-reverse;min-height:138px;justify-content:flex-start}.stack .letter{font-size:15px;margin:3px;padding:6px 9px}.bag small{font-size:12px}#msg{min-height:56px}#result{padding:18px;border:2px solid #719387;border-radius:18px;margin:20px 0}textarea{width:100%;min-height:100px;margin-top:12px}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{font-size:12px;margin-top:24px}a{color:#326556}@media(max-width:450px){#bags{gap:7px}.stack .letter{font-size:13px;padding:6px}.bag{font-size:14px}}</style><main><header><span>DAY & NIGHT POST / 026</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>昼夜邮局</h1><p>昼遇夜，同级升。把一封信，送成一串惊喜。</p><div class="stats"><div>投递<b id="turn">0 / 20</b></div><div>邮资<b id="score">0</b></div><div>失误余量<b id="hp">3</b></div><div>最高<b id="best">0</b></div></div><section class="incoming"><div>这一封 <span id="current">—</span></div><small>下一封 <span id="next">—</span></small></section><div id="bags"></div><p id="msg" role="status">每袋最多 3 封。同级且昼夜相反时合成，升级后保留来信的昼夜属性。</p><section id="result" hidden></section><div class="actions"><button id="start">开始投递</button><button id="share">分享邮资</button></div><textarea id="copy" aria-label="分享文字" hidden readonly></textarea><p>点击邮袋或按 1–4。只能与袋口最上面一封合成；满袋仍可接能合成的信。错误投满袋扣一次失误但不消耗来信。20 封后结算；无处可放或失误用完则提前结束。无倒计时，约 1–2 分钟。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-26">源码、调研与设计</a> · 零广告 · 本机最高分</footer></main><script>
const $=s=>document.querySelector(s);let bags=[[],[],[],[]],queue=[],turn=0,score=0,hp=3,active=false,muted=false,ac,best=0;try{best=+localStorage.getItem('daynight-post')||0}catch{}
function card(c){return c?`<span class="letter ${c.p?'night':''}">${c.p?'☾ 夜':'☀ 昼'} ${c.r}</span>`:'—'}function matches(a,b){return a&&b&&a.r===b.r&&a.p!==b.p}function can(i){return bags[i].length<3||matches(bags[i].at(-1),queue[turn])}function tone(ok){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(ok?440:140,ac.currentTime);o.frequency.exponentialRampToValueAtTime(ok?880:90,ac.currentTime+.18);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.start();o.stop(ac.currentTime+.23)}catch{}}
function draw(){$('#turn').textContent=`${turn} / 20`;$('#score').textContent=score;$('#hp').textContent=hp;$('#best').textContent=best;$('#current').innerHTML=active?card(queue[turn]):'—';$('#next').innerHTML=active?card(queue[turn+1]):'—';$('#bags').innerHTML=bags.map((a,i)=>`<button class="bag" data-i="${i}" ${active?'':'disabled'} aria-label="${i+1}号邮袋，${a.length}封"><div class="stack">${a.map(card).join('')}</div><strong>${i+1} 号袋</strong><small>${a.length} / 3 封</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>drop(+b.dataset.i))}
function end(reason){active=false;best=Math.max(best,score);try{localStorage.setItem('daynight-post',best)}catch{}$('#result').hidden=false;$('#result').textContent=`${reason} · ${score} 邮资 · 已投 ${turn} 封。再开一局，试着留下不同等级的昼夜搭档。`}
function start(){bags=[[],[],[],[]];turn=score=0;hp=3;queue=Array.from({length:20},(_,i)=>({r:i<8?1:Math.random()<.3?2:1,p:Math.random()<.5?0:1}));active=true;$('#result').hidden=true;$('#copy').hidden=true;$('#start').textContent='重新投递';$('#msg').textContent='先找同级、昼夜相反的袋口来信。';tone(true);draw()}
function drop(i){if(!active)return;if(!can(i)){hp--;tone(false);$('#msg').textContent='这个邮袋已满，且袋口不能合成。失误余量 -1。';if(!hp)end('投递结束');draw();return}let incoming={...queue[turn]},chain=0;while(matches(bags[i].at(-1),incoming)){bags[i].pop();incoming.r++;score+=incoming.r*20;chain++}bags[i].push(incoming);turn++;$('#msg').textContent=chain?`合成 ${chain} 次！现在是 ${incoming.r} 级${incoming.p?'夜':'昼'}信。`:'信已放入，看看下一封。';tone(true);if(turn===20)end('20 封全部投递');else if(!bags.some((_,j)=>can(j)))end('所有邮袋都无法接信');draw()}
$('#start').onclick=start;document.addEventListener('keydown',e=>{if(e.target.tagName!=='TEXTAREA'&&['1','2','3','4'].includes(e.key)){e.preventDefault();drop(+e.key-1)}});$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)tone(true)};$('#share').onclick=async()=>{let t=`我在《昼夜邮局》投了 ${turn} 封信，得到 ${score} 邮资！ https://xiangjianan.github.io/daily-original-games/2026-09-26/`;$('#copy').hidden=false;$('#copy').value=t;try{await navigator.clipboard.writeText(t);$('#msg').textContent='分享文字已复制。'}catch{$('#msg').textContent='请复制下面的文字。'}};draw();
</script></main></html>
