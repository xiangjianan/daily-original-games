<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>三色雨庭 · 一分钟种出好心情</title><style>
:root{font-family:system-ui,sans-serif;color:#203e38;background:#f5f1e6}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:2px}button{font:inherit;cursor:pointer;border:0;border-radius:18px;background:#214d42;color:white;padding:14px 20px}button:focus-visible{outline:4px solid #e29930;outline-offset:4px}h1{font-size:clamp(40px,8vw,70px);margin:22px 0 8px;letter-spacing:-3px}p{line-height:1.7}.sub{color:#68796e}.stats{display:flex;justify-content:space-between;padding:18px 0;border-top:1px solid #ccd4c8;margin-top:26px}.stats strong{display:block;font-size:27px}.sky{background:#e5ebdf;border-radius:24px;padding:22px;text-align:center}.drop{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;margin:5px;font-size:24px;box-shadow:0 4px 0 #0001}.c0{background:#f4b746;color:#503100}.c1{background:#81b7d5;color:#173b54}.c2{background:#dc8e98;color:#572532}.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.pot{min-height:164px;background:#fffdf8;color:#264b40;border:2px solid #cbd7c7;padding:14px 5px;transition:transform .12s}.pot:active{transform:scale(.97)}.pot:disabled{opacity:.48;cursor:not-allowed}.soil{font-size:13px;margin-top:12px}.slots{min-height:58px}.slots .drop{width:34px;height:34px;font-size:18px;margin:2px}.actions{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#e4e8dc;color:#294e42}#message{min-height:52px;font-weight:650}#result{background:#fffdf8;border:2px solid #d7bd75;border-radius:20px;padding:24px;margin:20px 0}progress{width:100%;height:8px;accent-color:#467764}footer{margin-top:28px;font-size:12px;color:#617267}#shareText{width:100%;margin-top:10px;padding:12px} @media(max-width:480px){main{padding:20px 14px}.pots{gap:8px}.pot{min-height:148px}.slots .drop{width:28px;height:28px}.stats strong{font-size:23px}}
</style></head><body><main><header><span>RAIN GARDEN / 001</span><button id="sound" class="secondary" aria-pressed="false">音效：开</button></header><h1>三色雨庭</h1><p class="sub">点花盆，接雨滴。三色齐，花就开。</p><div class="stats"><div>花园得分<strong id="score">0</strong></div><div>剩余雨滴<strong id="left">30</strong></div><div>花园活力<strong id="lives">♥ ♥ ♥</strong></div><div>最高分<strong id="best">0</strong></div></div><progress id="progress" max="30" value="30"></progress><section class="sky"><div id="forecast">准备好接住第一滴雨了吗？</div><p id="weather">30 滴雨 · 无倒计时 · 约 1–2 分钟</p></section><div class="pots"><button class="pot" data-pot="0"><div>一号花盆</div><div class="slots"></div><div class="soil">等待雨滴</div></button><button class="pot" data-pot="1"><div>二号花盆</div><div class="slots"></div><div class="soil">等待雨滴</div></button><button class="pot" data-pot="2"><div>三号花盆</div><div class="slots"></div><div class="soil">等待雨滴</div></button></div><div id="message" role="status" aria-live="polite">每盆收集 ● ◆ ▲ 三色。重复颜色会清空该盆，并失去一颗活力。</div><section id="result" hidden></section><div class="actions"><button id="start">开始接雨</button><button id="share" class="secondary">分享花园</button></div><textarea id="shareText" aria-label="可复制的分享内容" hidden readonly></textarea><p class="sub">也可按 1 / 2 / 3 选盆。连续开花会加分；接雨但未开花不会断连。第 13 滴起，每 3 滴有一个花盆轮换休眠，不能接雨。</p><footer>原创小实验 · 2026.09.16 · 无广告，无外部素材<br><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-16">设计与源码</a></footer></main><script>
const symbols=['●','◆','▲'],names=['金色圆点','蓝色菱形','粉色三角'];let pots,queue,turn,score,lives,combo,active=false,muted=false,audio,best=0;try{best=Number(localStorage.getItem('rain-best'))||0}catch{};document.querySelector('#best').textContent=best;
const $=s=>document.querySelector(s);function tone(ok){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();[0,.09,.18].slice(0,ok?3:1).forEach((d,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=ok?[440,554,660][i]:180;g.gain.setValueAtTime(.055,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d+.18);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.2)})}catch{}}
function dot(c){return `<span class="drop c${c}" aria-label="${names[c]}">${symbols[c]}</span>`}function lock(){return turn>=12?Math.floor((turn-12)/3)%3:-1}function render(){ $('#score').textContent=score;$('#left').textContent=30-turn;$('#lives').textContent='♥ '.repeat(lives)||'—';$('#progress').value=30-turn;$('#forecast').innerHTML=active?`这一滴 ${dot(queue[turn])} <span class="sub">下一滴 ${turn<29?dot(queue[turn+1]):'结束'}</span>`:'雨停了，花园留下了你的选择。';$('#weather').textContent=active?(lock()<0?'前 12 滴：三个花盆都可以接雨':`${lock()+1} 号盆休眠 · 再过 ${3-(turn-12)%3} 滴轮换`):'再种一局，试试不同的分配。';document.querySelectorAll('.pot').forEach((b,i)=>{b.disabled=!active||i===lock();b.querySelector('.slots').innerHTML=pots[i].map(dot).join('')||'＋';b.querySelector('.soil').textContent=active&&i===lock()?'休眠中':`已收集 ${pots[i].length}/3 色`;b.setAttribute('aria-label',`${i+1}号花盆，${pots[i].map(c=>names[c]).join('、')||'空'}${active&&i===lock()?'，休眠中':''}`)})}
function start(){pots=[[],[],[]];queue=Array.from({length:30},()=>Math.floor(Math.random()*3));turn=score=combo=0;lives=3;active=true;$('#result').hidden=true;$('#shareText').hidden=true;$('#start').textContent='重新开始';$('#message').textContent='看看下一滴，把同一种颜色分给不同的盆。';tone(true);render()}
function pick(i){if(!active||i===lock())return;let c=queue[turn];if(pots[i].includes(c)){pots[i]=[];lives--;combo=0;$('#message').textContent='重复颜色，花盆清空了。下一滴重新规划！';tone(false)}else{pots[i].push(c);if(pots[i].length===3){pots[i]=[];combo++;let gain=100+Math.min(combo-1,5)*20;score+=gain;$('#message').textContent=`✿ 开花！+${gain} · 连续 ${combo} 朵`;tone(true)}else{$('#message').textContent=`接住${names[c]}。还差 ${3-pots[i].length} 种颜色开花。`}}turn++;if(turn===30||lives===0){active=false;best=Math.max(best,score);try{localStorage.setItem('rain-best',best)}catch{}$('#best').textContent=best;$('#result').hidden=false;$('#result').innerHTML=`<h2>${lives?'雨过，花开。':'花园需要休息啦。'}</h2><p>本局 <strong>${score}</strong> 分 · 接住 ${turn} 滴雨。<br>最高 ${best} 分。预览下一滴，留一只空盆，往往能多开一朵。</p>`}render()}
document.querySelectorAll('.pot').forEach((b,i)=>b.onclick=()=>pick(i));$('#start').onclick=start;document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)&&e.target.tagName!=='TEXTAREA'){e.preventDefault();pick(Number(e.key)-1)}});$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)tone(true)};$('#share').onclick=async()=>{const t=`我在《三色雨庭》种出了 ${score||0} 分的花园！三色齐，花就开。 https://xiangjianan.github.io/daily-original-games/2026-09-16/`;$('#shareText').hidden=false;$('#shareText').value=t;try{await navigator.clipboard.writeText(t);$('#message').textContent='分享文案已复制，发给朋友一起种花。'}catch{$('#shareText').select();$('#message').textContent='分享文案已准备好，请复制下面的文字。'}};document.querySelectorAll('.pot').forEach(b=>b.disabled=true);
</script></body></html>
