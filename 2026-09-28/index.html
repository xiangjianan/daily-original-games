<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>苔格花房</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f2df;color:#294939;font:17px/1.6 system-ui}main{max-width:630px;margin:auto;padding:25px 18px}header{display:flex;justify-content:space-between;align-items:center;color:#668066;font-size:12px}h1{font-size:clamp(40px,8vw,64px);margin:25px 0 8px}p{color:#6a7d61}button{font:inherit;cursor:pointer;background:#3f704c;color:white;border:1px solid #779a68;border-radius:12px;padding:12px 16px}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:4px solid #df9b31;outline-offset:3px}.stats{display:flex;justify-content:space-between;margin:25px 0}.stats b{display:block;font-size:25px}.panel{background:#e0e6c9;padding:18px;border-radius:20px}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.cell{aspect-ratio:1;background:#fafbea;color:#52764c;padding:2px;font-size:23px}.moss{background:#81af68;color:#173e29}.rock{background:#8f9481;color:white}#msg{min-height:65px}#result{border:2px solid #73965c;border-radius:18px;padding:20px;margin:18px 0}.actions{display:flex;flex-wrap:wrap;gap:10px}textarea{width:100%;min-height:100px;margin-top:12px}footer{font-size:12px;margin-top:25px}a{color:#46704c}</style><main><header><span>MOSS QUADRANTS / 028</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>苔格花房</h1><p>种下两格绿意，拼出四格小花圃。</p><section class="stats"><div>种植<b id="turn">0 / 18</b></div><div>收获<b id="score">0</b></div><div>最高<b id="best">0</b></div></section><div class="panel"><button id="rotate">方向：横向 →</button><p>点空格作为起点，向右种两格；切换方向可向下种。四格苔藓组成 2×2 即收获清空。</p></div><div id="board"></div><p id="msg" role="status">18 次种植，每 6 次长出一块石头（最后一次除外）。石头不能种，也不能收获。</p><section id="result" hidden></section><div class="actions"><button id="start">打开花房</button><button id="share">分享花圃</button></div><textarea id="copy" aria-label="分享文字" hidden readonly></textarea><p>无处可种则提前结束。重叠或越界不耗次数。按 R 切换方向，Tab/空格选格。没有倒计时，约 1–3 分钟。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-28">源码、调研与设计</a> · 无广告 · 本机最高分</footer></main><script>
const $=s=>document.querySelector(s);let cells=Array(25).fill(0),turn=0,score=0,vertical=false,active=false,muted=false,ac,best=0;try{best=+localStorage.getItem('moss-quadrants')||0}catch{}
function pair(i,v=vertical){let j=i+(v?5:1);return j<25&&(v||i%5<4)&&cells[i]===0&&cells[j]===0?[i,j]:null}function stone(){let free=cells.map((v,i)=>v===0?i:-1).filter(i=>i>=0);if(free.length)cells[free[Math.floor(Math.random()*free.length)]]=2}function sound(ok){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(ok?490:160,ac.currentTime);o.frequency.exponentialRampToValueAtTime(ok?900:100,ac.currentTime+.18);g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.start();o.stop(ac.currentTime+.23)}catch{}}
function draw(){$('#turn').textContent=`${turn} / 18`;$('#score').textContent=score;$('#best').textContent=best;$('#rotate').textContent=vertical?'方向：纵向 ↓':'方向：横向 →';$('#board').innerHTML=cells.map((v,i)=>`<button class="cell ${v===1?'moss':v===2?'rock':''}" data-i="${i}" data-value="${v}" aria-label="${Math.floor(i/5)+1}行${i%5+1}列 ${v===1?'苔藓':v===2?'石头':'空地'}" ${active?'':'disabled'}>${v===1?'✿':v===2?'◆':'·'}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>plant(+b.dataset.i))}
function end(reason){active=false;best=Math.max(best,score);try{localStorage.setItem('moss-quadrants',best)}catch{}$('#result').hidden=false;$('#result').textContent=`${reason} · 收获 ${score} 分，种植 ${turn} 次。再来一局，试试留出整块方形空间。`}
function start(){cells=Array(25).fill(0);turn=score=0;vertical=false;stone();stone();active=true;$('#result').hidden=true;$('#copy').hidden=true;$('#start').textContent='重新种植';$('#msg').textContent='先找一块空的 2×2，用两次种植拼满它。';sound(true);draw()}
function plant(i){if(!active)return;let p=pair(i);if(!p){$('#msg').textContent='这里放不下两格。换个起点或切换方向，不扣次数。';sound(false);return}p.forEach(j=>cells[j]=1);turn++;let clear=new Set(),squares=0;for(let r=0;r<4;r++)for(let c=0;c<4;c++){let ids=[r*5+c,r*5+c+1,(r+1)*5+c,(r+1)*5+c+1];if(ids.every(j=>cells[j]===1)){squares++;ids.forEach(j=>clear.add(j))}}clear.forEach(j=>cells[j]=0);score+=squares*100;$('#msg').textContent=squares?`收获 ${squares} 块花圃！+${squares*100} 分。`:'苔藓种好了，再拼成 2×2。';if(turn<18&&turn%6===0){stone();$('#msg').textContent+=' 新石头出现了。'}sound(true);if(turn===18)end('18 次种植完成');else if(!cells.some((_,j)=>pair(j,false)||pair(j,true)))end('花房已无处可种');draw()}
$('#start').onclick=start;function rotate(){vertical=!vertical;draw()}$('#rotate').onclick=rotate;document.addEventListener('keydown',e=>{if(e.target.tagName!=='TEXTAREA'&&e.key.toLowerCase()==='r'){e.preventDefault();rotate()}});$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)sound(true)};$('#share').onclick=async()=>{let t=`我在《苔格花房》收获 ${score} 分，种植 ${turn} 次！ https://xiangjianan.github.io/daily-original-games/2026-09-28/`;$('#copy').hidden=false;$('#copy').value=t;try{await navigator.clipboard.writeText(t);$('#msg').textContent='花圃成绩已复制。'}catch{$('#msg').textContent='请复制下方文字。'}};draw();
</script></main></html>
