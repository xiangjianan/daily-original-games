<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>回声织灯</title><style>*{box-sizing:border-box}body{margin:0;background:#171829;color:#f4ebda;font:17px/1.65 system-ui}main{max-width:800px;margin:auto;padding:24px 20px}header{display:flex;justify-content:space-between;align-items:center;color:#b6add4;font-size:12px;letter-spacing:2px}h1{font-size:clamp(42px,9vw,70px);margin:25px 0 5px}p{color:#bdb6d0}button{font:inherit;border:1px solid #716184;border-radius:14px;background:#343047;color:#f6eedc;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #ffd389;outline-offset:3px}.stats{display:flex;justify-content:space-between;margin:26px 0}.stats b{display:block;font-size:25px}.panel{padding:22px;background:#22233b;border:1px solid #48435f;border-radius:24px;margin-bottom:18px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.lamp{padding:12px 0;text-align:center;border:1px solid #696079;border-radius:15px;background:#2e2b42;color:#aaa3b8}.on{background:#ffcf80;color:#3e2c24;border-color:#ffdfad;box-shadow:0 0 18px #ffc77222}.target .lamp{padding:8px 0;font-size:14px}.lamp small{display:block;font-size:12px}.legend{font-size:13px;color:#bdb6d0}#msg{min-height:54px}#result{padding:20px;border:1px solid #e2b667;border-radius:18px;margin:18px 0}textarea{width:100%;min-height:100px;margin-top:15px}footer{font-size:12px;margin-top:20px}a{color:#d5bfe8}.actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main><header><span>ECHO LOOM / 024</span><button id="sound" aria-pressed="false">音效：开</button></header><h1>回声织灯</h1><p>一指拨动，两盏回应。把眼前的灯，织成上面的光。</p><section class="stats"><div>灯谱<b id="stage">1 / 3</b></div><div>剩余步数<b id="left">8</b></div><div>得分<b id="score">0</b></div><div>最高<b id="best">0</b></div></section><section class="panel"><span class="legend">目标灯谱 · ● 亮 / ○ 暗</span><div id="target" class="row target" aria-label="目标灯谱"></div><span class="legend">点击下方任意灯，同时翻转它与下一编号；最后一盏连回第一盏。</span><div id="board" class="row" aria-label="可操作灯谱"></div><div id="match" class="legend"></div></section><p id="msg" role="status">三段灯谱，逐步从 6 盏增加到 10 盏。无倒计时，约 1–3 分钟。</p><section id="result" hidden></section><div class="actions"><button id="start">开始织灯</button><button id="next" hidden>下一段灯谱</button><button id="share">分享灯谱</button></div><textarea id="copy" aria-label="分享文字" hidden readonly></textarea><p class="legend">按 Tab 选灯、空格操作。少用一步多得 20 分。每题保证可解；步数耗尽即结束，可重新挑战。</p><footer><a href="https://github.com/xiangjianan/daily-original-games/tree/main/2026-09-24">源码、调研与设计</a> · 零广告 · 无外部素材</footer></main><script>
const $=s=>document.querySelector(s);let stage=0,n=6,bits=Array(6).fill(0),target=[1,1,0,0,0,0],left=8,score=0,active=false,muted=false,ac,best=0;try{best=+localStorage.getItem('echo-loom-best')||0}catch{}
function tone(ok){if(muted)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();ac.resume();[0,.08].forEach((d,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=ok?[440,660][i]:150;g.gain.setValueAtTime(.05,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.18);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2)})}catch{}}
function draw(){document.querySelectorAll('.row').forEach(e=>e.style.gridTemplateColumns=`repeat(${n/2},1fr)`); $('#stage').textContent=`${stage+1} / 3`;$('#left').textContent=left;$('#score').textContent=score;$('#best').textContent=best;$('#target').innerHTML=target.map((v,i)=>`<div class="lamp ${v?'on':''}" data-value="${v}">${v?'●':'○'}<small>${i+1}</small></div>`).join('');$('#board').innerHTML=bits.map((v,i)=>`<button class="lamp ${v?'on':''}" data-value="${v}" data-i="${i}" aria-label="${i+1}号灯，${v?'亮':'暗'}，同时翻转${(i+1)%n+1}号" ${active?'':'disabled'}>${v?'●':'○'}<small>${i+1}</small></button>`).join('');$('#match').textContent=`已吻合 ${bits.filter((v,i)=>v===target[i]).length} / ${n} 盏`;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>move(+b.dataset.i));}
function level(){n=6+stage*2;bits=Array(n).fill(0);target=Array(n).fill(0);let indices=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}indices.slice(0,2+stage).forEach(i=>{target[i]^=1;target[(i+1)%n]^=1});left=n+2;active=true;$('#next').hidden=true;$('#result').hidden=true;$('#msg').textContent='先看目标，再拨动灯。点击两次同一盏，会回到原样。';draw()}
function start(){stage=score=0;$('#copy').hidden=true;$('#start').textContent='重新开始';level();tone(true)}
function move(i){if(!active)return;bits[i]^=1;bits[(i+1)%n]^=1;left--;tone(true);if(bits.every((v,j)=>v===target[j])){score+=100+left*20;active=false;best=Math.max(best,score);try{localStorage.setItem('echo-loom-best',best)}catch{}$('#msg').textContent=`灯谱吻合！本段 +${100+left*20} 分。`;if(stage<2)$('#next').hidden=false;else{$('#result').hidden=false;$('#result').textContent=`三段全部点亮 · ${score} 分！再试一份新灯谱，挑战更少步数。`}}else if(left===0){active=false;tone(false);$('#msg').textContent='步数用完了。';$('#result').hidden=false;$('#result').textContent=`本次织灯结束 · ${score} 分。重新挑战，试着从左到右规划。`}else $('#msg').textContent=`拨动 ${i+1} 号，同时翻转 ${(i+1)%n+1} 号。`;draw();if(active)document.querySelector(`[data-i="${i}"]`).focus()}
$('#start').onclick=start;$('#next').onclick=()=>{stage++;level()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=`音效：${muted?'关':'开'}`;$('#sound').setAttribute('aria-pressed',String(muted));if(!muted)tone(true)};$('#share').onclick=async()=>{let t=`我在《回声织灯》得了 ${score} 分！一指拨动，两盏回应。 https://xiangjianan.github.io/daily-original-games/2026-09-24/`;$('#copy').hidden=false;$('#copy').value=t;try{await navigator.clipboard.writeText(t);$('#msg').textContent='分享文字已复制。'}catch{$('#msg').textContent='请复制下面的分享文字。'}};draw();
</script></body></html>
